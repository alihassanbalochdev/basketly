# App icon. Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/brand/icon.png"
  # Android 8+ adaptive icon: plum background, saffron basket on top.
  adaptive_icon_background: "#3D1440"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/brand/icon.png"
    background_color: "#3D1440"
    theme_color: "#3D1440"
